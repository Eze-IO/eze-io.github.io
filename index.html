<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <title>Eze-IO | Resources</title>
  <meta name="author" content="Eze Ahuna">
  <meta name="description" content="A collection of resources and links from Eze-IO.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d9488">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <style type="text/tailwindcss">
    @theme {
      --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
    }
    @custom-variant dark (&:where(.dark, .dark *));
  </style>
  <script>
    // Apply the saved (or system) theme before first paint to avoid a flash
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.classList.toggle("dark", dark);
    })();
  </script>
</head>
<body class="flex min-h-full flex-col bg-slate-50 font-sans text-slate-800 antialiased dark:bg-slate-950 dark:text-slate-200">

  <!-- Navigation -->
  <header class="sticky top-0 z-50 border-b border-slate-200/70 bg-white/80 backdrop-blur-lg dark:border-slate-800 dark:bg-slate-900/80">
    <nav class="mx-auto flex max-w-6xl items-center justify-between gap-3 px-4 py-3 sm:px-6">
      <a href="index.html" class="flex shrink-0 items-center gap-2 text-lg font-bold tracking-tight">
        <span class="grid size-9 place-items-center rounded-xl bg-gradient-to-br from-teal-400 to-emerald-600 text-white shadow-md shadow-teal-500/30">
          <i class="fa-solid fa-cube"></i>
        </span>
        <span>Eze<span class="text-teal-600 dark:text-teal-400">-IO</span></span>
      </a>
      <div class="flex items-center gap-2">
        <a href="http://eze-io.com" class="hidden rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900 sm:inline-block dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white">
          Main Webpage
        </a>
        <button id="theme-toggle" type="button" aria-label="Toggle dark mode"
          class="grid size-9 place-items-center rounded-lg text-slate-600 transition hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">
          <span class="dark:hidden"><i class="fa-solid fa-moon"></i></span>
          <span class="hidden dark:inline"><i class="fa-solid fa-sun"></i></span>
        </button>
      </div>
    </nav>
  </header>

  <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-10 sm:px-6 sm:py-14">
    <!-- Hero -->
    <div class="mb-8 text-center sm:mb-10">
      <span class="inline-flex items-center gap-2 rounded-full bg-teal-50 px-3 py-1 text-xs font-semibold text-teal-700 ring-1 ring-teal-600/20 dark:bg-teal-500/10 dark:text-teal-300 dark:ring-teal-400/20">
        <i class="fa-solid fa-folder-open"></i> Resources
      </span>
      <h1 class="mt-4 text-3xl font-extrabold tracking-tight sm:text-4xl md:text-5xl">
        Click on any of the links below
      </h1>
      <p class="mx-auto mt-3 max-w-xl text-slate-500 dark:text-slate-400">
        Files, designs and media — open them in a new tab or search to find what you need.
      </p>
    </div>

    <!-- Search -->
    <form id="search-form" role="search" class="relative mx-auto mb-10 max-w-xl">
      <label for="search" class="sr-only">Search resources</label>
      <i class="fa-solid fa-magnifying-glass pointer-events-none absolute top-1/2 left-4 -translate-y-1/2 text-slate-400"></i>
      <input id="search" type="search" maxlength="50" autocomplete="off" placeholder="Search for a resource…"
        class="w-full rounded-2xl border border-slate-200 bg-white py-3.5 pr-4 pl-11 text-base shadow-sm outline-none transition placeholder:text-slate-400 focus:border-teal-500 focus:ring-4 focus:ring-teal-500/15 dark:border-slate-700 dark:bg-slate-900 dark:focus:border-teal-400">
    </form>

    <p id="result-count" class="mb-4 text-sm text-slate-500 dark:text-slate-400" aria-live="polite"></p>

    <!-- Resource grid -->
    <section id="items" class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">
      <noscript>
        <p class="col-span-full rounded-2xl border border-dashed border-slate-300 p-10 text-center text-lg font-semibold dark:border-slate-700">
          No resources or links are available!
        </p>
      </noscript>
    </section>
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900">
    <div class="mx-auto flex max-w-6xl flex-col items-center justify-between gap-2 px-4 py-5 text-sm text-slate-500 sm:flex-row sm:px-6 dark:text-slate-400">
      <a href="http://eze-io.com" class="font-semibold text-teal-600 hover:text-teal-700 dark:text-teal-400 dark:hover:text-teal-300">
        <i class="fa-solid fa-house mr-1"></i> Main Webpage
      </a>
      <p>Copyright &copy; Eze Ahuna 2017&ndash;<span id="year">2026</span></p>
    </div>
  </footer>

<script>
(function () {
  var grid = document.getElementById("items");
  var count = document.getElementById("result-count");
  var input = document.getElementById("search");
  var resources = [];

  // File-type icon and accent colour, picked from the URL's extension
  var TYPES = [
    { ext: ["png", "jpg", "jpeg", "gif", "svg", "webp", "ico", "bmp"], icon: "fa-file-image", color: "from-pink-500 to-rose-500", label: "Image" },
    { ext: ["pdf"], icon: "fa-file-pdf", color: "from-red-500 to-orange-500", label: "PDF" },
    { ext: ["xls", "xlsx", "csv"], icon: "fa-file-excel", color: "from-green-500 to-emerald-600", label: "Spreadsheet" },
    { ext: ["doc", "docx"], icon: "fa-file-word", color: "from-blue-500 to-indigo-600", label: "Document" },
    { ext: ["ppt", "pptx"], icon: "fa-file-powerpoint", color: "from-orange-500 to-amber-500", label: "Presentation" },
    { ext: ["js", "html", "htm", "css", "json", "xml", "java"], icon: "fa-file-code", color: "from-slate-600 to-slate-800", label: "Code" },
    { ext: ["mp4", "mov", "avi", "webm", "mkv"], icon: "fa-file-video", color: "from-violet-500 to-purple-600", label: "Video" },
    { ext: ["mp3", "wav", "ogg", "flac", "m4a"], icon: "fa-file-audio", color: "from-amber-500 to-yellow-500", label: "Audio" },
    { ext: ["zip", "rar", "gz", "tar", "7z"], icon: "fa-file-zipper", color: "from-stone-500 to-stone-700", label: "Archive" },
    { ext: ["txt", "md"], icon: "fa-file-lines", color: "from-sky-500 to-cyan-500", label: "Text" }
  ];
  var DEFAULT_TYPE = { icon: "fa-file", color: "from-teal-500 to-emerald-600", label: "File" };

  function typeFor(url) {
    var path = url.split(/[?#]/)[0];
    var ext = path.indexOf(".") > -1 ? path.split(".").pop().toLowerCase() : "";
    for (var i = 0; i < TYPES.length; i++) {
      if (TYPES[i].ext.indexOf(ext) > -1) return TYPES[i];
    }
    return DEFAULT_TYPE;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function hostOf(url) {
    try { return new URL(url, location.href).hostname; } catch (e) { return url; }
  }

  function card(item) {
    var t = typeFor(item.url);
    var isImage = t.label === "Image";
    var preview = isImage
      ? "<img src='" + escapeHtml(item.url) + "' alt='' loading='lazy' class='absolute inset-0 h-full w-full object-contain p-4 transition duration-300 group-hover:scale-105'>"
      : "<i class='fa-solid " + t.icon + " text-5xl text-white drop-shadow transition duration-300 group-hover:scale-110'></i>";
    var bg = isImage ? "bg-slate-100 dark:bg-slate-800" : "bg-gradient-to-br " + t.color;
    return "" +
      "<a href='" + escapeHtml(item.url) + "' target='_blank' rel='noopener' " +
        "class='group flex flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm transition duration-200 hover:-translate-y-1 hover:shadow-xl hover:shadow-slate-900/5 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-teal-500/30 dark:border-slate-800 dark:bg-slate-900 dark:hover:border-slate-700'>" +
        "<div class='relative grid h-40 place-items-center overflow-hidden " + bg + "'>" + preview + "</div>" +
        "<div class='flex flex-1 items-center justify-between gap-3 p-4'>" +
          "<div class='min-w-0'>" +
            "<h2 class='truncate font-semibold text-slate-900 dark:text-white'>" + escapeHtml(item.name) + "</h2>" +
            "<p class='mt-0.5 truncate text-xs text-slate-500 dark:text-slate-400'>" +
              "<span class='font-medium'>" + t.label + "</span> · " + escapeHtml(hostOf(item.url)) +
            "</p>" +
          "</div>" +
          "<i class='fa-solid fa-arrow-up-right-from-square shrink-0 text-slate-400 transition group-hover:text-teal-600 dark:group-hover:text-teal-400'></i>" +
        "</div>" +
      "</a>";
  }

  function message(icon, title, detail, isError) {
    count.textContent = "";
    grid.innerHTML =
      "<div class='col-span-full flex flex-col items-center rounded-2xl border border-dashed border-slate-300 px-6 py-14 text-center dark:border-slate-700'>" +
        "<i class='fa-solid " + icon + " text-4xl " + (isError ? "text-red-500" : "text-slate-400") + "'></i>" +
        "<p class='mt-4 text-lg font-semibold " + (isError ? "text-red-600 dark:text-red-400" : "") + "'>" + escapeHtml(title) + "</p>" +
        (detail ? "<p class='mt-1 text-sm text-slate-500 dark:text-slate-400'>" + escapeHtml(detail) + "</p>" : "") +
      "</div>";
  }

  function skeletons() {
    var html = "";
    for (var i = 0; i < 3; i++) {
      html += "<div class='animate-pulse overflow-hidden rounded-2xl border border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900'>" +
        "<div class='h-40 bg-slate-200 dark:bg-slate-800'></div>" +
        "<div class='space-y-2 p-4'><div class='h-4 w-2/3 rounded bg-slate-200 dark:bg-slate-800'></div><div class='h-3 w-1/3 rounded bg-slate-200 dark:bg-slate-800'></div></div>" +
      "</div>";
    }
    grid.innerHTML = html;
  }

  function render(query) {
    var q = (query || "").trim().toLowerCase();
    var terms = q ? q.split(/\s+/) : [];
    var matches = resources.filter(function (item) {
      var hay = (item.name + " " + item.url).toLowerCase();
      return terms.every(function (term) { return hay.indexOf(term) > -1; });
    });
    if (!resources.length) return message("fa-box-open", "No resource items are available");
    if (!matches.length) return message("fa-magnifying-glass", "No results for “" + query.trim() + "”", "Try a different search term.");
    grid.innerHTML = matches.map(card).join("");
    count.textContent = q
      ? matches.length + " of " + resources.length + " resources"
      : resources.length + " resource" + (resources.length === 1 ? "" : "s");
  }

  skeletons();
  fetch("misc/resources.json", { cache: "no-cache" })
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(function (json) {
      if (!Array.isArray(json.items)) throw new Error("Missing items list");
      json.items.forEach(function (group) {
        Object.keys(group).forEach(function (name) {
          if (name && group[name]) resources.push({ name: name, url: group[name] });
        });
      });
      render(input.value);
    })
    .catch(function (e) {
      console.log("Failed to get resource items: " + e.message);
      message("fa-triangle-exclamation", "Error: failed to get resource items", "Please try again later.", true);
    });

  // Live search as you type; Enter just keeps the page from reloading
  input.addEventListener("input", function () { render(input.value); });
  document.getElementById("search-form").addEventListener("submit", function (e) {
    e.preventDefault();
    render(input.value);
  });

  document.getElementById("year").textContent = new Date().getFullYear();

  document.getElementById("theme-toggle").addEventListener("click", function () {
    var dark = document.documentElement.classList.toggle("dark");
    try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch (e) {}
  });
})();
</script>
</body>
</html>
